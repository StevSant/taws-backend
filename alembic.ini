[alembic]
script_location = migrations
prepend_sys_path = src

# No `sqlalchemy.url` here on purpose — the Supabase Postgres connection string
# (with credentials) comes from `Settings.database_url` (`.env`) at runtime, in
# `migrations/env.py`, so it's never committed via this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
